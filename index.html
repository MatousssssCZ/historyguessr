          <h1>Historyguesser — GeoGuessr pro historii</h1>
          <p>Historyguesser je vzdělávací geolokační hra inspirovaná GeoGuessrem, ale zaměřená na historii. Ocitneš se v 360° panoramatu historického místa a hádáš, <strong>kde na světě</strong> se událost odehrála a <strong>v jakém roce</strong>. Čím blíž skutečnému místu a roku, tím víc bodů.</p>
          <h2>Jak se to hraje</h2>
          <ol>
            <li>Rozhlédneš se po 360° panoramatu a hledáš stopy — architekturu, přírodu, oblečení.</li>
            <li>Klepnutím na mapu určíš, kde na světě se událost stala.</li>
            <li>Posuvníkem odhadneš rok. Sbíráš body, úrovně a odznaky.</li>
          </ol>
          <h2>Herní režimy</h2>
          <p>Sólo hra, denní výzva „Tento den v historii", historické kampaně a multiplayer až pro 12 hráčů.</p>
          <h2>Časté dotazy</h2>
          <p><strong>Je zdarma?</strong> Ano, hraní je zdarma. Volitelné Premium (99 Kč/měsíc) přidává hru bez reklam a pokročilé funkce.</p>
          <p><strong>V jakých jazycích?</strong> Čeština, angličtina a němčina.</p>
          <p><strong>Čím se liší od GeoGuessru?</strong> Kromě místa hádáš i rok historické události — hra je vzdělávací.</p>
          <p>Pro hraní je potřeba prohlížeč s JavaScriptem. Otevři <a href="https://historyguesser.net/">historyguesser.net</a>.</p>
        </main>
