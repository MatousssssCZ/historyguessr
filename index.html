          <h1>Poznáš, kde a kdy se to stalo?</h1>
          <p>HistoryGuesser je jako GeoGuessr, ale pro historii. Ocitneš se přímo uprostřed historické události v interaktivním 360° panoramatu. Rozhlížej se, hledej stopy a zkus určit dvě věci: <strong>kde na světě se nacházíš</strong> a <strong>v jakém roce se událost odehrála</strong>. Čím přesnější budeš, tím více bodů získáš.</p>
          <h2>Jak se hraje</h2>
          <ol>
            <li><strong>Prozkoumej historickou scénu.</strong> Rozhlédni se po 360° panoramatu a hledej stopy — architekturu, krajinu, oblečení, dopravní prostředky, nápisy nebo technologie.</li>
            <li><strong>Uhodni, kde se událost odehrála.</strong> Vyber na mapě místo, kde si myslíš, že se nacházíš.</li>
            <li><strong>Odhadni správný rok.</strong> Pomocí časové osy urči rok, kdy se událost odehrála.</li>
          </ol>
          <h2>Herní režimy</h2>
          <p>Klasická hra, denní výzva „Tento den v historii", historické kampaně a multiplayer až pro 12 hráčů.</p>
          <h2>Časté dotazy</h2>
          <p><strong>Je zdarma?</strong> Ano. HistoryGuesser můžeš hrát zdarma. Volitelné Premium za 99 Kč měsíčně odemyká všechny kampaně, hraní bez reklam a další pokročilé funkce.</p>
          <p><strong>Musím se registrovat?</strong> Ne. Začít hrát můžeš i jako host bez registrace. S účtem si ale můžeš ukládat postup, výsledky a statistiky.</p>
          <p><strong>Čím se liší od GeoGuessru?</strong> Kromě místa hádáš i rok, kdy se událost odehrála — a při hraní objevuješ skutečné události, osobnosti a místa z historie.</p>
          <p><strong>V jakých jazycích?</strong> Čeština, angličtina a němčina.</p>
          <p>Pro hraní je potřeba prohlížeč s JavaScriptem. Otevři <a href="https://historyguesser.net/">historyguesser.net</a>.</p>
        </main>
